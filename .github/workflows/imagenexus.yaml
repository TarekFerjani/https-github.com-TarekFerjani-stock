name: Build and Push to Nexus

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag Docker"
        required: true
        default: "latest"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/docker-hosted/frigo:${{ github.event.inputs.image_tag }}
            ${{ secrets.NEXUS_REGISTRY }}/docker-hosted/frigo:${{ github.sha }}

      - name: Show result
        run: |
          echo
